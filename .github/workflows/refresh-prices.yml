name: Refresh prices

# 21:30 UTC is after the 4pm New York close both in winter (4:30pm ET) and summer (5:30pm ET).
# Writes prices.json at the repository root from Yahoo's latest completed daily close.
# GitHub Pages serves that file at https://prices.bigyetigames.com/prices.json.
# See src/refresh_prices.py.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild prices.json
        run: python3 src/refresh_prices.py
      - name: Commit the snapshot
        run: |
          git config user.name "Classets prices"
          git config user.email "prices@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "prices unchanged"
          else
            git commit -m "Refresh market prices from the latest completed close"
            git push
          fi
